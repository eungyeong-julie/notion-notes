<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>오늘 기록하기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📝 조금씩 기록하기</h1>

    <!-- form 삭제 → div로 감싸기 -->
    <div id="note-box">
      <textarea
        id="text"
        placeholder="오늘의 기록을 남겨보세요"
        rows="4"
      ></textarea>
      <button id="send-btn" type="button">전송</button>
    </div>

    <p id="result"></p>
  </div>

  <script>
    const result = document.getElementById('result');
    const button = document.getElementById('send-btn');
    const textArea = document.getElementById('text');

    async function sendText() {
      const text = textArea.value.trim();

      if (!text) {
        result.style.color = '#d92b2b';
        result.textContent = '✏️ 내용을 입력해 주세요.';
        return;
      }

      // 전송 중 상태
      button.disabled = true;
      button.textContent = '전송 중... ⏳';
      result.textContent = '';

      try {
        const res = await fetch('/add-text', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ text }),
        });

        let data = {};
        try {
          data = await res.json();
        } catch (_) {}

        if (res.ok && data.success) {
          // ✅ 성공: 팝업 + 입력창 비우기
          alert('🌱 기록이 추가되었습니다.');
          textArea.value = '';
          result.textContent = '';
        } else {
          result.style.color = '#d92b2b';
          result.textContent = '⚠️ 기록 추가에 실패했습니다. 다시 시도해 주세요.';
          console.error('서버 응답:', data);
        }
      } catch (error) {
        console.error(error);
        result.style.color = '#d92b2b';
        result.textContent = '🚫 오류가 발생했습니다.';
      } finally {
        button.disabled = false;
        button.textContent = '전송';
      }
    }

    // 버튼 클릭으로만 전송
    button.addEventListener('click', sendText);

    // (선택) textarea에서 Enter는 그냥 줄바꿈만 되도록 - 아무 것도 안 함
    // 굳이 막지 않아도 기본 동작이 줄바꿈이라 그대로 두면 됨 🙂
  </script>
</body>
</html>
